name: Build 100gram iOS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
            echo "Selected Xcode ${XCODE_VERSION}"
          else
            echo "Xcode ${XCODE_VERSION} not available on this runner, using: $(xcode-select -p)"
            echo "Proceeding with --overrideXcodeVersion"
          fi

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT + $BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # Patch provisioning profiles: replace old bundle ID with the new one
          python3 - <<'PYEOF'
import os, sys, plistlib, subprocess, tempfile, re

ORIG = 'ph.telegra.Telegraph'
NEW  = 'ph.stogra.stograph'
DIR  = 'build-system/fake-codesigning/profiles'

# Find signing identity from the imported keychain
result = subprocess.run(['security', 'find-identity', '-v', '-p', 'codesigning', 'temp.keychain'],
                        capture_output=True, text=True)
m = re.search(r'\) [0-9A-F]+ "(.*?)"', result.stdout)
if not m:
    print('ERROR: no signing identity found in temp.keychain')
    print(result.stdout)
    sys.exit(1)
identity = m.group(1)
print(f'Signing identity: {identity}')

for fname in sorted(os.listdir(DIR)):
    if not fname.endswith('.mobileprovision'):
        continue
    fpath = os.path.join(DIR, fname)
    dec = subprocess.run(['security', 'cms', '-D', '-i', fpath], capture_output=True, check=True)
    data = plistlib.loads(dec.stdout)
    ent = data.get('Entitlements', {})
    for key in list(ent.keys()):
        v = ent[key]
        if isinstance(v, str) and ORIG in v:
            ent[key] = v.replace(ORIG, NEW)
        elif isinstance(v, list):
            ent[key] = [x.replace(ORIG, NEW) if isinstance(x, str) else x for x in v]
    tmp = tempfile.mktemp(suffix='.plist')
    with open(tmp, 'wb') as f:
        plistlib.dump(data, f, fmt=plistlib.FMT_XML)
    subprocess.run(['security', 'cms', '-S', '-k', 'temp.keychain', '-N', identity, '-i', tmp, '-o', fpath], check=True)
    os.unlink(tmp)
    print(f'Patched {fname}')
PYEOF

          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_PATH/"
          done

          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            [ -e "$f" ] && cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 100gram-ios-${{ env.BUILD_NUMBER }}
          path: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: "100gram iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          body: "100gram (gramsrv) iOS build — unsigned IPA, bundle ph.stogra.stograph"
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
